name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.13'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. TYPECHECK · LINT · UNIT TESTS — the gauntlet
  # ──────────────────────────────────────────────────────────────────
  gauntlet:
    name: Gauntlet · typecheck · lint · 540+ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (8 workspaces)
        run: bun run typecheck

      - name: Lint (Biome · 243 files)
        run: bun run lint

      - name: Unit tests (540+ across 36 files)
        run: bun test
        timeout-minutes: 5

      - name: Knowledge-graph unit tests (graphify-style continuous learning)
        run: bun test packages/agents/src/knowledge-graph

  # ──────────────────────────────────────────────────────────────────
  # 2. py-svc — FastAPI sidecar (imaging · genomics · NER · translate · quantum)
  # ──────────────────────────────────────────────────────────────────
  py-svc:
    name: py-svc · pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/py-svc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: |
          uv run ruff check . || true
          uv run ruff format --check . || true
      - name: Tests (pytest)
        run: uv run pytest tests/ -q

  # ──────────────────────────────────────────────────────────────────
  # 3. CORE FUNCTIONALITY — end-to-end pipeline smoke
  # ──────────────────────────────────────────────────────────────────
  pipeline-smoke:
    name: Spine smoke · /orchestrate end-to-end
    runs-on: ubuntu-latest
    needs: gauntlet
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Smoke test
        run: bun run spine:smoke
        timeout-minutes: 5

  # ──────────────────────────────────────────────────────────────────
  # 4. PAGE AUDIT — every API endpoint smoke (no UI in CI)
  # ──────────────────────────────────────────────────────────────────
  page-audit:
    name: Page audit · 31 endpoints
    runs-on: ubuntu-latest
    needs: gauntlet
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Spawn API + run audit + stop
        run: |
          bun run --filter @dr-abc/api dev &
          API_PID=$!
          echo "spawned api pid=$API_PID"

          # Wait for API up to 60 s
          for i in {1..30}; do
            if curl -fsS http://localhost:8787/ > /dev/null 2>&1; then
              echo "API up"; break
            fi
            sleep 2
          done

          MORBIUS_WEB_BASE=http://localhost:5173 bun run scripts/page-audit.ts || true

          kill "$API_PID" 2>/dev/null || true
      - name: Upload audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: page-audit-${{ github.run_id }}
          path: docs/status/page-audit-*.json
          if-no-files-found: warn
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────
  # 5. ACCURACY — MedQA + persona harness on a small sample
  # ──────────────────────────────────────────────────────────────────
  accuracy-smoke:
    name: Accuracy · MedQA 20 + persona doctor
    runs-on: ubuntu-latest
    needs: gauntlet
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[accuracy]')
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Spawn API
        run: |
          bun run --filter @dr-abc/api dev &
          sleep 8
      - name: MedQA harness · limit 20
        run: bun run scripts/medqa-harness.ts --limit 20 || true
        env:
          MORBIUS_API_BASE: http://localhost:8787
      - name: Persona harness · doctor only
        run: bun run morbius:persona -- --persona doctor || true
        env:
          MORBIUS_API_BASE: http://localhost:8787
      - name: Upload accuracy snapshots
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-${{ github.run_id }}
          path: |
            docs/status/medqa-*.json
            docs/status/persona-*.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────
  # 6. SECURITY — secrets + dependency audit
  # ──────────────────────────────────────────────────────────────────
  security:
    name: Security · gitleaks + bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun audit (best-effort)
        run: bun audit || true

  # ──────────────────────────────────────────────────────────────────
  # 7. REPORT BUNDLE — collect every CI result into the GitHub summary
  # ──────────────────────────────────────────────────────────────────
  ci-report:
    name: CI report bundle
    runs-on: ubuntu-latest
    needs: [gauntlet, py-svc, pipeline-smoke, page-audit, security]
    if: always()
    steps:
      - name: Job summary
        run: |
          {
            echo "# Mörbius CI · ${{ github.sha }}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| gauntlet (typecheck · lint · 540 tests) | ${{ needs.gauntlet.result }} |"
            echo "| py-svc (pytest + ruff) | ${{ needs.py-svc.result }} |"
            echo "| pipeline smoke (/orchestrate) | ${{ needs.pipeline-smoke.result }} |"
            echo "| page-audit (31 endpoints) | ${{ needs.page-audit.result }} |"
            echo "| security (gitleaks · bun audit) | ${{ needs.security.result }} |"
            echo ""
            echo "Branch: \`${{ github.ref_name }}\`"
            echo "Triggered by: \`${{ github.event_name }}\`"
          } >> $GITHUB_STEP_SUMMARY
