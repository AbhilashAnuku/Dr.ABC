[project]
name = "dr-abc-py-svc"
version = "0.1.0"
description = "Python sidecar for Dr.ABC / Mörbius — imaging, genomics, NER over HTTP"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Abhilash Anuku", email = "abhilashanuku14@gmail.com" }]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pillow>=11.0,<12",
    "numpy>=2.1,<3",
    "python-multipart>=0.0.20,<0.1",
    "scispacy>=0.5.5,<0.6",
    "spacy>=3.7,<3.8",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
imaging = [
    # Heavy imaging deps; install with `uv sync --extra imaging` or in the
    # GPU profile. CPU-only fallback uses pure-numpy histogram analysis.
    "monai[nibabel,gdown]>=1.4,<2",
    "torch>=2.4,<3",
    "torchvision>=0.19,<0.20",
    "pydicom>=3.0,<4",
]
genomics = [
    "pyvcf3>=1.0,<2",
    "biopython>=1.84,<2",
]
translate = [
    # MarianMT live-translation pipeline. Each language pair downloads
    # an additional ~300 MB Helsinki-NLP model on first use; cached
    # under ~/.cache/huggingface/. Without this extra installed the
    # /translate router falls through to a stub that returns the source
    # text unchanged.
    "transformers>=4.46,<5",
    "sentencepiece>=0.2,<0.3",
    "sacremoses>=0.1,<0.2",
    "torch>=2.4,<3",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]
# Architect's v0.8 godmode (2026-05-06): "use LangGraph for the
# knowledge graph of Mörbius and its training agents." Free + MIT.
# Install with `uv sync --extra langgraph`.
langgraph = [
    "langgraph>=0.2.50,<0.3",
    "langchain-core>=0.3.20,<0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"] # line length covered by formatter

[tool.uv]
package = false
