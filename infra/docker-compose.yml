version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dr-abc-postgres
    environment:
      POSTGRES_USER: morbius
      POSTGRES_PASSWORD: morbius_dev
      POSTGRES_DB: dr_abc
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U morbius -d dr_abc']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dr-abc-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: dr-abc-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  ollama:
    image: ollama/ollama:latest
    container_name: dr-abc-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  py-svc:
    build:
      context: ../apps/py-svc
      dockerfile: Dockerfile
    container_name: dr-abc-py-svc
    ports:
      - '8001:8001'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      IMAGING_BACKEND: ${IMAGING_BACKEND:-stub}
      NER_BACKEND: ${NER_BACKEND:-regex}
      GENOMICS_BACKEND: ${GENOMICS_BACKEND:-stub}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://localhost:8001/health").status==200 else 1)']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
