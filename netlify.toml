# Netlify deployment for the Dr·ABC web app.
#
# Build is Bun-driven; the published artefact is the Vite production
# bundle. The /api/* rewrite points at the Fly.io-hosted Hono API by
# default — change it to your own deployment URL once you provision.

[build]
  base = "."
  command = "bun install --frozen-lockfile && bun run --filter @dr-abc/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.13"

# SPA fallback — every unknown route serves index.html so wouter can
# resolve it client-side. /assets/* is excluded so the cache headers
# below still apply.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://morbius-api.fly.dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the immutable hashed assets — Vite stamps a content hash
# in every filename so 1-year caching is safe.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sane security defaults for the SPA shell.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
