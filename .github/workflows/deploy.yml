name: Deploy

# Tag-triggered deploy: push any `vMAJOR.MINOR.PATCH` semver tag (with
# optional pre-release / codename suffix) and the web bundle goes to
# Vercel and the API goes to Fly.io. The verify gauntlet (lint +
# typecheck + test + build) always runs. The deploy lanes only fire
# when the corresponding secrets are configured — pushing a tag
# without secrets produces a clean green run with a "secrets missing"
# warning rather than a red one. Wire the secrets, then re-run via the
# `workflow_dispatch` trigger or push a fresh tag.
#
# Tag naming convention (release codename "Mörbius Core X" for 0.4.x):
#   v0.4.0       — clean semver release
#   v0.4.1       — patch
#   v0.5.0-rc1   — release candidate
# Both shapes match the glob below.
#
# Manual trigger (`workflow_dispatch`) lets the architect re-run a deploy
# without re-tagging — useful when only env / secret values changed.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - web
          - api

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Pre-flight: same gates as ci.yml so we never deploy a broken tag.
  verify:
    name: Verify (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      web_dist: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run --filter @dr-abc/web build

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 14
          if-no-files-found: error

  # Secrets preflight — emits boolean outputs so the deploy jobs can
  # gate cleanly. Secrets can't be referenced from job-level `if:`, but
  # they CAN be assigned to env at step level and shape an output. This
  # is the canonical workaround.
  secrets-check:
    name: Secrets preflight
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_vercel: ${{ steps.check.outputs.has_vercel }}
      has_fly: ${{ steps.check.outputs.has_fly }}
    steps:
      - id: check
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
          VO: ${{ secrets.VERCEL_ORG_ID }}
          VP: ${{ secrets.VERCEL_PROJECT_ID }}
          FT: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${VT:-}" ] && [ -n "${VO:-}" ] && [ -n "${VP:-}" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets present → web deploy will run."
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel secrets missing::Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in repo secrets to enable web deploy."
          fi
          if [ -n "${FT:-}" ]; then
            echo "has_fly=true" >> "$GITHUB_OUTPUT"
            echo "Fly secret present → api deploy will run."
          else
            echo "has_fly=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Fly secret missing::Set FLY_API_TOKEN in repo secrets (\`fly tokens create deploy\`) to enable api deploy."
          fi

  # Web → Vercel. Reads VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID
  # from repo secrets. The build was already done in `verify`, so we
  # deploy the prebuilt artifact rather than re-running the Vercel
  # builder. Skips cleanly when secrets aren't configured.
  deploy-web:
    name: Web → Vercel
    needs: [verify, secrets-check]
    if: |
      needs.secrets-check.outputs.has_vercel == 'true'
      && (github.event_name == 'push' || github.event.inputs.target == 'web' || github.event.inputs.target == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Install Vercel CLI
        run: bun install -g vercel@latest

      - name: Pull Vercel env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # API → Fly. Uses the project's Dockerfile.api via fly.toml. Requires
  # FLY_API_TOKEN in repo secrets (`fly tokens create deploy`). Skips
  # cleanly when the token isn't configured.
  deploy-api:
    name: API → Fly.io
    needs: [verify, secrets-check]
    if: |
      needs.secrets-check.outputs.has_fly == 'true'
      && (github.event_name == 'push' || github.event.inputs.target == 'api' || github.event.inputs.target == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml

  # Smoke check after deploy lanes finish. Hits the live /health and
  # the landing to confirm the deploy actually came up. Always-runs +
  # continue-on-error so it never fails the workflow — it's a signal,
  # not a gate. Skips entirely if neither deploy ran.
  post-deploy-smoke:
    name: Post-deploy smoke
    needs: [deploy-web, deploy-api]
    if: always() && (needs.deploy-web.result == 'success' || needs.deploy-api.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - name: Web landing
        if: needs.deploy-web.result == 'success'
        run: |
          set +e
          code=$(curl -o /dev/null -s -w "%{http_code}" https://morbius.vercel.app/)
          echo "landing → $code"
      - name: API health
        if: needs.deploy-api.result == 'success'
        run: |
          set +e
          curl -s https://morbius-api.fly.dev/health | head -c 400 || true
          echo
